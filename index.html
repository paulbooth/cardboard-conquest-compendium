<style>
  /* The jukebox's palette (tools/jukebox.html): UIKit's kraft stock on the cutting mat. This
     page is a lookup table, not the book, so it keeps the colours and drops the motion. */
  :root{
    --mat:#26413c; --mat-hi:#2f4f49;
    --card:#e2d7c0; --card-hi:#ece2ce; --card-lo:#d3c6ab;
    --ink:#201913; --ink-soft:#6b5c48;
    --stamp:#a83422; --crimson:#8f2b21; --crimson-lo:#6d1f18;
    --link:#1d5f8f; --rule:rgba(32,25,19,.16);
    --up:#2c7a2a; --summon:#4a6b3a; --spell:#2f5f8a; --power:#7a4a8a; --curse:#7d2a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Lato","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:var(--mat);min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(120% 80% at 80% -10%,rgba(255,228,178,.20),transparent 60%);
    background-attachment:fixed}
  a{color:var(--link)}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 16px 80px}
  header{color:#f3ead8;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
  header h1{margin:0;font-size:28px;letter-spacing:.01em}
  header .sub{color:#c9bfa9;font-size:14px;background:none;padding:0}

  .bar{position:sticky;top:0;z-index:5;background:var(--mat);padding:10px 0 8px;
    box-shadow:0 8px 14px -10px rgba(0,0,0,.6)}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tab{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:3px;cursor:pointer;
    padding:9px 14px;background:var(--card-lo);color:var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .tab .n{font-weight:400;color:var(--ink-soft);margin-left:6px}
  .tab[aria-selected=true]{background:var(--crimson);color:#fff8ec}
  .tab[aria-selected=true] .n{color:#f0c9bf}
  .search{display:flex;gap:8px;align-items:center}
  .search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:3px;
    border:0;background:var(--card-hi);color:var(--ink);box-shadow:inset 0 2px 4px rgba(32,25,19,.18)}
  .search .count{color:#e6dcc6;font-size:14px;white-space:nowrap}
  .filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
  .fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  .fgroup .lab{color:#c9bfa9;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
  .chip{font:inherit;font-size:13px;border:1px solid #6f8a83;background:transparent;color:#e9e1cf;
    border-radius:14px;padding:3px 10px;cursor:pointer}
  .chip[aria-pressed=true]{background:#d9b45a;border-color:#d9b45a;color:#201913;font-weight:700}
  select.chip{appearance:auto;background:var(--mat-hi);max-width:240px}
  .clear{font:inherit;font-size:13px;background:none;border:0;color:#d9b45a;cursor:pointer;text-decoration:underline}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px;margin-top:14px}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr))}
  .item{background:linear-gradient(180deg,var(--card-hi),var(--card) 30%,var(--card-lo));
    border-radius:3px;padding:10px 12px 12px;box-shadow:0 6px 14px rgba(0,0,0,.32),0 1px 3px rgba(0,0,0,.3);
    display:flex;flex-direction:column;gap:6px;min-width:0}
  .item .top{display:flex;gap:10px;align-items:flex-start}
  .art{width:72px;height:72px;flex:none;border-radius:3px;background:#cdbf9f center/contain no-repeat;
    box-shadow:inset 0 0 0 1px var(--rule)}
  .art.big{width:96px;height:96px}
  .art.none{display:none}
  .head{min-width:0;flex:1}
  .name{font-weight:800;font-size:17px;line-height:1.2}
  .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .cost{flex:none;width:30px;height:30px;border-radius:50%;background:#2a4f7a;color:#fff;font-weight:800;
    display:grid;place-items:center;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .kind{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:2px;padding:1px 6px;
    text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
  .kind.summon{background:var(--summon)} .kind.spell{background:var(--spell)}
  .kind.power{background:var(--power)} .kind.curse{background:var(--curse)}
  .kind.other{background:#6b5c48}
  .text{font-size:14px;line-height:1.38;white-space:pre-line;overflow-wrap:anywhere}
  .cost.wide{width:auto;min-width:30px;padding:0 9px;border-radius:15px;display:flex;align-items:center;gap:3px}
  .cost small{font-size:12px;font-weight:700;color:#bfe8ad}
  .up{color:var(--up);font-weight:700}
  del.up{text-decoration:line-through;font-weight:400}
  .uptext{font-size:13px;color:var(--ink-soft);white-space:pre-line}
  .uptext b{color:var(--up)}
  .stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;font-weight:700}
  .stats span b{font-weight:400;color:var(--ink-soft);margin-right:3px}
  .kw{font-size:13px;line-height:1.35}
  .kw b{color:var(--stamp)}
  .flavor{font-size:12.5px;font-style:italic;color:var(--ink-soft)}
  .warn{font-size:13px;color:var(--crimson)}
  .tagline{font-size:12px;color:var(--ink-soft)}
  .empty{color:#e6dcc6;padding:30px 0;text-align:center}
  details{border-top:1px solid var(--rule);padding-top:6px}
  summary{cursor:pointer;font-weight:700;color:var(--link);font-size:14px}
  h4{margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--crimson)}
  .sublist{display:grid;gap:6px}
  .ref{display:flex;gap:8px;align-items:flex-start;margin-top:2px}
  .ref .art{width:52px;height:52px}
  .ref>div{min-width:0}
  .sub{background:rgba(255,255,255,.35);border-radius:3px;padding:6px 8px;font-size:13px;line-height:1.35}
  .sub .nm{font-weight:800}
  .sub.lit{animation:lit 1.4s ease-out}
  @keyframes lit{from{background:rgba(235,195,94,.6)}to{background:rgba(255,255,255,.35)}}
  .deck{display:flex;flex-wrap:wrap;gap:4px}
  .deck a{font-size:12.5px;border:1px solid var(--rule);background:rgba(255,255,255,.4);
    border-radius:2px;padding:2px 6px;color:var(--link);text-decoration:none}
  .deck a:hover{text-decoration:underline}
  mark{background:#f1d77a;color:inherit;border-radius:2px}

  /* Every entry is a link: its name is an <a> to #tab/key, and a click anywhere on the
     tile opens it on its own, so the address bar holds a link to just that entry. */
  .name a{color:inherit;text-decoration:none}
  .name a:hover{text-decoration:underline}
  .grid:not(.one) .item{cursor:pointer}
  .grid:not(.one) .item:hover{box-shadow:0 6px 14px rgba(0,0,0,.32),0 0 0 2px #d9b45a}
  .grid.one{grid-template-columns:minmax(0,520px)}
  .grid.one.wide{grid-template-columns:minmax(0,760px)}
  .chip.go{border-color:#d9b45a;color:#d9b45a;font-weight:700}
  footer{color:#a9b8b2;font-size:12.5px;margin-top:40px;text-align:center}
  @media (max-width:520px){
    header h1{font-size:22px}
    .grid,.grid.wide{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cardboard Conquest Compendium</h1>
    <span class="sub" id="ver"></span>
  </header>
  <div class="bar">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search names, rules text, keywords, packs..." autocomplete="off" aria-label="Search">
      <span class="count" id="count"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <main id="out" class="grid"></main>
  <footer>Built from the game's own data. Want to suggest a card? Search here first, then tell us in the Discord.</footer>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
let D = null;
// show: the key of the one entry on screen (#cards/<key>), or null for the whole shelf.
const state = {tab: "cards", q: "", f: {}, show: null};
const TITLE = document.title;

const TABS = [
  {id: "cards", label: "Cards", one: "card"},
  {id: "pins", label: "Pins", one: "pin"},
  {id: "enemies", label: "Enemies", one: "enemy"},
  {id: "warlords", label: "Warlords", one: "warlord"},
  {id: "keywords", label: "Keywords", one: "keyword"},
];

// ---- one entry per link ---------------------------------------------------------------
// A key per entry: its name as a slug, so a shared link reads as what it shows
// (#cards/spectral-call); the game's own id where two entries share a name. The id opens
// the entry too (the dump's ids are the game's: Spectral Call is "ritual"), and the page
// rewrites such a link to the name.
const slug = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
function keyEntries() {
  D.byKey = {};
  for (const t of TABS) {
    const m = D.byKey[t.id] = new Map();
    const seen = {};
    for (const x of D[t.id]) { const s = slug(x.name); seen[s] = (seen[s] || 0) + 1; }
    for (const x of D[t.id]) {
      const s = slug(x.name);
      const base = s && seen[s] === 1 ? s : (x.id ? String(x.id) : (s || "entry"));
      let k = base;
      for (let n = 2; m.has(k); n++) k = base + "-" + n;
      x._key = k;
      m.set(k, x);
    }
    for (const x of D[t.id]) if (x.id && !m.has(String(x.id))) m.set(String(x.id), x);
  }
}
const entryHash = (tab, x) => "#" + tab + "/" + encodeURIComponent(x._key);
const tile = (tab, x) => `<article class="item" data-key="${esc(x._key)}">`;
const nameLink = (tab, x, inner) => `<a href="${esc(entryHash(tab, x))}">${inner}</a>`;

// ---- search ---------------------------------------------------------------------------
// Every word must appear somewhere in the entry (name, rules, keywords, section). Quoted
// phrases match as a phrase.
function tokens(q) {
  const out = [];
  q.toLowerCase().replace(/"([^"]+)"|(\S+)/g, (_, a, b) => { out.push(a || b); });
  return out;
}
function hayOf(x) {
  if (!x._hay) x._hay = JSON.stringify(x, (k, v) => (k === "art" || k === "icon" || k === "_hay" || k === "_key") ? undefined : v).toLowerCase();
  return x._hay;
}
const matches = (x, toks) => toks.every(t => hayOf(x).includes(t));
function hl(s) {
  s = esc(s);
  const toks = tokens(state.q).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!toks.length) return s;
  return s.replace(new RegExp("(" + toks.map(esc).join("|") + ")", "gi"), "<mark>$1</mark>");
}

// ---- filters --------------------------------------------------------------------------
// Each group is a list of {key, label} chips; inside a group chips are OR, across groups AND.
const COST_KEY = c => c.cost < 0 ? "X" : (c.cost >= 5 ? "5+" : String(c.cost));
const FILTERS = {
  cards: () => [
    {id: "type", label: "Type", get: c => c.type, opts: ["summon", "spell", "power", "curse"]},
    {id: "cost", label: "Cost", get: COST_KEY, opts: ["0", "1", "2", "3", "4", "5+", "X"]},
    {id: "rarity", label: "Rarity", get: c => c.rarity, opts: ["starter", "common", "uncommon", "rare", "legendary", "unique", "curse"]},
    {id: "melee", label: "Body", get: c => c.unit ? (c.unit.melee ? "melee" : "ranged") : "", opts: ["melee", "ranged"]},
    {id: "section", label: "Pack", get: c => c.section, select: true},
  ],
  pins: () => [
    {id: "shelf", label: "Shelf", get: p => p.shelf, select: true},
  ],
  enemies: () => [
    {id: "act", label: "Act", get: e => "Act " + e.act, opts: ["Act 1", "Act 2", "Act 3"]},
    {id: "tier", label: "Tier", get: e => e.tier, opts: ["Normal", "Elite", "Boss"]},
  ],
  warlords: () => [],
  keywords: () => [],
};
function groupsFor(tab) {
  const gs = FILTERS[tab]();
  for (const g of gs) {
    if (!g.opts) {
      const seen = [];
      for (const x of D[tab]) { const v = g.get(x); if (v && !seen.includes(v)) seen.push(v); }
      g.opts = seen;
    } else {
      g.opts = g.opts.filter(o => D[tab].some(x => g.get(x) === o));
    }
  }
  return gs.filter(g => g.opts.length > 1);
}
function passes(x, gs) {
  for (const g of gs) {
    const on = state.f[g.id];
    if (on && on.size && !on.has(g.get(x))) return false;
  }
  return true;
}
function drawFilters(gs) {
  const box = $("#filters");
  box.innerHTML = "";
  for (const g of gs) {
    const div = document.createElement("div");
    div.className = "fgroup";
    div.innerHTML = `<span class="lab">${esc(g.label)}</span>`;
    const on = state.f[g.id] || new Set();
    if (g.select) {
      const sel = document.createElement("select");
      sel.className = "chip";
      sel.innerHTML = `<option value="">All</option>` + g.opts.map(o => `<option${on.has(o) ? " selected" : ""}>${esc(o)}</option>`).join("");
      sel.onchange = () => { state.f[g.id] = new Set(sel.value ? [sel.value] : []); update(); };
      div.appendChild(sel);
    } else {
      for (const o of g.opts) {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = g.id === "cost" || g.id === "act" ? o : cap(o);
        b.setAttribute("aria-pressed", on.has(o));
        b.onclick = () => {
          const s = state.f[g.id] || (state.f[g.id] = new Set());
          s.has(o) ? s.delete(o) : s.add(o);
          update();
        };
        div.appendChild(b);
      }
    }
    box.appendChild(div);
  }
  if (Object.values(state.f).some(s => s.size)) {
    const c = document.createElement("button");
    c.className = "clear"; c.textContent = "Clear filters";
    c.onclick = () => { state.f = {}; update(); };
    box.appendChild(c);
  }
}

// ---- renderers ------------------------------------------------------------------------
const artUrl = p => p ? (D.artMap[p] || "") : "";
const artDiv = (p, big) => { const u = artUrl(p); return `<div class="art${big ? " big" : ""}${u ? "" : " none"}"${u ? ` style="background-image:url('${u}')"` : ""}></div>`; };
const kindOf = t => ["summon", "spell", "power", "curse"].includes(t) ? t : "other";
function stats(u, squad, up) {
  if (!u) return "";
  up = up || {};
  const v = (base, k, f) => (f || String)(base) + (up[k] !== undefined ? ` <span class="up">(${(f || String)(up[k])})</span>` : "");
  const s = [`<span><b>HP</b>${v(u.hp, "hp")}</span>`, `<span><b>ATK</b>${v(u.damage, "damage")}</span>`,
    `<span><b>Range</b>${u.melee ? "melee" : v(u.range, "range")}</span>`];
  if ((squad && squad > 1) || up.squad) s.push(`<span><b>Squad</b>${v(squad || 1, "squad", n => "x" + n)}</span>`);

let qt = 0;
$("#q").addEventListener("input", e => {
  clearTimeout(qt);
  qt = setTimeout(() => {
    const was = state.show;
    state.q = e.target.value.trim(); state.show = null;
    update(was ? "push" : undefined);
  }, 120);
});

fetch("data.json").then(r => r.json()).then(d => {
  D = d;
  D.artMap = d.artMap || {};
  keyEntries();
  $("#ver").textContent = `${d.cards.length} cards, ${d.pins.length} pins, ${d.enemies.length} enemies, ${d.warlords.length} warlords` + (d.version ? ` · game version ${d.version}` : "") + ". Click any entry for a link to it.";
  readHash();
  update(true);
  lastHash = location.hash;
}).catch(err => { $("#out").innerHTML = `<div class="empty">Could not load the compendium data (${esc(err.message)}).</div>`; });
</script>
</body>
</html>
